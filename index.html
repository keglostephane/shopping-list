<!doctype html>
<html>
  <head>
    <title>Shopping List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet" />
    <script src="script.js" defer></script>
    <meta charset="utf-8" />
  </head>
  <body>
    <div class="container">
      <header>
        <div id="heading">
          <img alt="" src="images/note.png"/>
          <h1>Shopping List</h1>
        </div>
        <form action="">
          <div class="form-control">
            <input id="get-item" name="item" type="text"
                   placeholder="Enter Item" />
          </div>
          <div class="form-control">
            <button id="add-item" type="button">Add Item</button>
          </div>
          <div class="form-control">
            <input id="filter-item" class ="hidden" name="filter"
                   type="search" placeholder="Filter Items" />
          </div>
        </form>
      </header>
      <main><!-- Main Content -->
        <ul id="shopping-list"><!-- Shopping List -->
        </ul>
      </main>
    </div>
  </body>
</html>
